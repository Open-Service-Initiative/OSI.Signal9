name: Build and test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OSI.Signal9.slnx

      - name: Build
        run: dotnet build OSI.Signal9.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution OSI.Signal9.slnx --no-build --configuration Release

      - name: Check for vulnerable packages
        run: dotnet package list --project OSI.Signal9.slnx --vulnerable --include-transitive
